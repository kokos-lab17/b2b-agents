name: CI & Automated Verification

on:
  workflow_dispatch:
  push:
    paths:
      - "requirements.txt"
      - ".github/workflows/check-deps.yml"
      - "backend/**"
      - "frontend/**"
      - "tests/**"
      - "main.py"
      - "agents.py"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  resolve-and-test:
    name: Backend Dependency Resolution & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Check dependency compatibility
        run: python -m pip install --dry-run --ignore-installed -r requirements.txt -v

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Backend Unit and Integration Tests
        run: python -m unittest discover -s tests -v

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js Frontend
        working-directory: frontend
        run: npm run build
